services:
  kwizly-postgres:
    image: postgres:18.6-bookworm
    container_name: kwizly-env-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always

  port-forwarder:
    image: alpine/socat:1.8.1.3
    container_name: kwizly-postgres-port-forwarder
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        socat tcp-listen:5432,fork,reuseaddr tcp-connect:kwizly-postgres:5432 &
        socat tcp-listen:6379,fork,reuseaddr tcp-connect:kwizly-redis:6379 &
        socat tcp-listen:9000,fork,reuseaddr tcp-connect:kwizly-minio-container:9000 &
        socat tcp-listen:9001,fork,reuseaddr tcp-connect:kwizly-minio-container:9001 &
        wait
    ports:
      - "127.0.0.1:25432:5432"
      - "127.0.0.1:26379:6379"
      - "127.0.0.1:29000:9000"
      - "127.0.0.1:29001:9001"
    depends_on:
      kwizly-postgres:
        condition: service_healthy
      kwizly-redis:
        condition: service_healthy
      kwizly-minio:
        condition: service_healthy
    restart: always

  kwizly-redis:
    image: redis:8.2.10-bookworm
    container_name: kwizly-redis-container
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  kwizly-minio:
    image: cgr.dev/chainguard/minio:latest-dev
    container_name: kwizly-minio-container
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ${PROJECT_ROOT}/out/minio_data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
