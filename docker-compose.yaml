services:
  kwizly-postgres:
    image: postgres:18.6-bookworm
    container_name: kwizly-env-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql
    restart: always

  kwizly-postgres-migrate:
    image: migrate/migrate:v4.20.1
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations

  port-forwarder:
    image: alpine/socat:1.8.1.3
    container_name: kwizly-postgres-port-forwarder
    command:
      - tcp-listen:5432,fork,reuseaddr tcp-connect:kwizly-postgres:5432
      - tcp-listen:6379,fork,reuseaddr tcp-connect:kwizly-redis:6379
    ports:
      - "127.0.0.1:25432:5432"
      - "127.0.0.1:26379:6379"

  kwizly-redis:
    image: redis:alpine3.22
    container_name: kwizly-redis-container
